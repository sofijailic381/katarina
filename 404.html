<body style="margin:0; min-height:100svh; display:grid; place-items:center; padding:32px; box-sizing:border-box; background:#FAE6E8; color:#362A3B; font-family:Manrope, system-ui, sans-serif">

<a class="home" id="home" href="/" style="display:inline-flex; align-items:center; min-height:54px; padding:0 28px; background:#362A3B; color:#FCF0F6; font-size:14px; letter-spacing:0.08em; text-decoration:none; transition:background-color .45s ease, color .45s ease">Nazad na početnu</a>

<script>(function(){var p=location.pathname.split('/').filter(Boolean);if(/\.github\.io$/.test(location.hostname)&&p.length){document.getElementById('home').href='/'+p[0]+'/';}})();</script>
